<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Yo Pongo El Tip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-container svg {
            max-width: 100%;
            height: auto;
            width: 320px;
        }

        h1 {
            display: none;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 1em;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            font-size: 1.8em;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #1E5BA8;
            box-shadow: 0 0 0 4px rgba(30, 91, 168, 0.1);
        }

        .presets {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .preset-btn {
            flex: 1;
            padding: 16px 10px;
            min-height: 52px;
            font-size: 1.15em;
            font-weight: 600;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-btn:hover {
            border-color: #1E5BA8;
            background: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 91, 168, 0.15);
        }

        .preset-btn:active {
            transform: translateY(0);
        }

        .preset-btn.active {
            background: linear-gradient(135deg, #0A8754 0%, #0A8754 100%);
            color: #ffffff;
            border-color: #0A8754;
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.3);
        }

        .slider-container {
            margin-bottom: 32px;
            padding: 24px;
            background: #f9fafb;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tip-percentage {
            font-size: 2.2em;
            font-weight: 700;
            color: #0A8754;
            letter-spacing: -1px;
        }

        .slider-wrapper {
            position: relative;
            padding: 20px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, #F5B800 0%, #0A8754 50%, #1E5BA8 100%);
            outline: none;
            -webkit-appearance: none;
            position: relative;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 60px;
            cursor: pointer;
            background: transparent;
            position: relative;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        input[type="range"]::-moz-range-thumb {
            width: 50px;
            height: 60px;
            cursor: pointer;
            border: none;
            background: transparent;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        .margarita-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            transform: translateX(-25px) translateY(-50px);
            transition: left 0.15s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .results {
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            border-radius: 16px;
            padding: 28px;
            margin-top: 28px;
            box-shadow: 0 10px 40px rgba(30, 91, 168, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .result-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #ffffff;
        }

        .tip-row {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 28px !important;
            margin: -8px -8px 24px -8px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
        }

        .tip-row .result-label {
            font-size: 1.4em;
            color: #ffffff;
        }

        .tip-row .result-value {
            font-size: 3.2em;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .total-row .result-label {
            font-size: 1.2em;
        }

        .total-row .result-value {
            font-size: 2em;
        }

        .expensive-warning {
            text-align: center;
            margin-top: 20px;
            padding: 16px;
            font-size: 1.8em;
            font-weight: 700;
            color: #ef4444;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            animation: shake 0.5s infinite;
            display: none;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .expensive-warning.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .logo-container svg {
                width: 250px;
            }

            .subtitle {
                font-size: 0.9em;
                margin-bottom: 24px;
            }

            .container {
                padding: 24px 20px;
            }

            .input-group {
                margin-bottom: 20px;
            }

            input[type="number"] {
                font-size: 1.6em;
                padding: 14px;
            }

            .presets {
                gap: 10px;
                margin-bottom: 24px;
            }

            .preset-btn {
                font-size: 1.05em;
                padding: 14px 8px;
                min-height: 48px;
            }

            .slider-container {
                padding: 20px 16px;
                margin-bottom: 24px;
            }

            .tip-percentage {
                font-size: 1.8em;
            }

            .tip-row {
                padding: 24px !important;
            }

            .tip-row .result-label {
                font-size: 1.2em;
            }

            .tip-row .result-value {
                font-size: 2.6em;
            }

            .result-value {
                font-size: 1.4em;
            }

            .total-row .result-value {
                font-size: 1.8em;
            }

            .expensive-warning {
                font-size: 1.5em;
                padding: 14px;
            }
        }

        @media (max-width: 375px) {
            .logo-container svg {
                width: 220px;
            }

            .tip-row .result-value {
                font-size: 2.2em;
            }

            .preset-btn {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg viewBox="0 0 650 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Calculator -->
                <g transform="translate(0, 20)">
                    <!-- Calculator body -->
                    <rect x="10" y="10" width="150" height="150" rx="15" fill="#1E5BA8" stroke="#003D7A" stroke-width="6"/>

                    <!-- Calculator screen -->
                    <rect x="25" y="25" width="120" height="40" rx="5" fill="#ffffff"/>
                    <text x="135" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0A8754" text-anchor="end">TIP%</text>

                    <!-- Calculator buttons -->
                    <rect x="25" y="75" width="50" height="35" rx="5" fill="#0A8754"/>
                    <text x="50" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>

                    <rect x="85" y="75" width="60" height="35" rx="5" fill="#003D7A"/>
                    <text x="115" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

                    <rect x="25" y="120" width="50" height="35" rx="5" fill="#003D7A"/>
                    <text x="50" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>

                    <rect x="85" y="120" width="60" height="35" rx="5" fill="#003D7A"/>
                    <text x="115" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
                </g>

                <!-- Dollar coin -->
                <g transform="translate(150, 20)">
                    <!-- Sun rays -->
                    <rect x="20" y="-5" width="8" height="20" rx="4" fill="#F5B800" transform="rotate(-45 24 5)"/>
                    <rect x="35" y="-10" width="8" height="25" rx="4" fill="#F5B800"/>
                    <rect x="50" y="-5" width="8" height="20" rx="4" fill="#F5B800" transform="rotate(45 54 5)"/>

                    <!-- Coin outer circle -->
                    <circle cx="40" cy="40" r="35" fill="#0A8754" stroke="#006838" stroke-width="4"/>

                    <!-- Coin inner circle -->
                    <circle cx="40" cy="40" r="28" fill="#0FB36A" stroke="#0A8754" stroke-width="2"/>

                    <!-- Dollar sign -->
                    <text x="40" y="58" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
                </g>

                <!-- Text: Yo Pongo -->
                <text x="240" y="80" font-family="Arial, sans-serif" font-size="62" font-weight="bold" fill="#003D7A">Yo Pongo</text>

                <!-- Text: El Tip -->
                <text x="240" y="150" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="#0A8754">El Tip</text>
            </svg>
        </div>
        <h1>Yo Pongo El Tip</h1>
        <div class="subtitle">Tip Calculator</div>

        <div class="input-group">
            <label for="billAmount">Bill Amount</label>
            <input type="number" id="billAmount" placeholder="$0.00" min="0" step="0.01" value="0" inputmode="decimal">
        </div>

        <div class="presets">
            <button class="preset-btn" data-tip="15">15%</button>
            <button class="preset-btn" data-tip="20">20%</button>
            <button class="preset-btn" data-tip="25">25%</button>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <label>Tip Percentage</label>
                <span class="tip-percentage" id="tipPercentageDisplay">15%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="tipSlider" min="0" max="30" value="15" step="1">
                <div class="margarita-icon" id="margaritaIcon">
                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- Straw -->
                        <rect x="65" y="5" width="4" height="45" fill="#5BC0DE" rx="2" transform="rotate(15 67 27)"/>
                        <rect x="64" y="3" width="6" height="4" fill="#3A9FBC" rx="1" transform="rotate(15 67 5)"/>

                        <!-- Glass stem -->
                        <path d="M 45 80 L 42 100 L 58 100 L 55 80 Z" fill="#5BC0DE" stroke="#3A9FBC" stroke-width="1.5"/>

                        <!-- Glass base -->
                        <ellipse cx="50" cy="100" rx="12" ry="3" fill="#5BC0DE" stroke="#3A9FBC" stroke-width="1.5"/>

                        <!-- Glass bowl -->
                        <path d="M 30 35 Q 25 50 28 65 L 72 65 Q 75 50 70 35 Z"
                              fill="url(#margaritaGradient)" stroke="#3A9FBC" stroke-width="2"/>

                        <!-- Liquid -->
                        <path d="M 31 40 Q 27 52 30 62 L 70 62 Q 73 52 69 40 Z"
                              fill="url(#liquidGradient)"/>

                        <!-- Ice/Foam on top -->
                        <ellipse cx="42" cy="38" rx="6" ry="4" fill="#E8F5E9" opacity="0.8"/>
                        <ellipse cx="52" cy="36" rx="7" ry="5" fill="#E8F5E9" opacity="0.9"/>
                        <ellipse cx="60" cy="39" rx="5" ry="4" fill="#E8F5E9" opacity="0.8"/>

                        <!-- Salt rim -->
                        <ellipse cx="50" cy="35" rx="20" ry="3" fill="#F0F0F0" opacity="0.9"/>
                        <path d="M 30 35 Q 32 33 35 34 Q 38 32 41 33 Q 44 31 47 33 Q 50 32 53 33 Q 56 31 59 33 Q 62 32 65 34 Q 68 33 70 35"
                              fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

                        <!-- Lime wedge -->
                        <g transform="translate(15, 25)">
                            <!-- Lime slice -->
                            <circle cx="0" cy="0" r="10" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
                            <circle cx="0" cy="0" r="7" fill="#9CCC65"/>
                            <path d="M 0 -7 L 0 0 M -5 -5 L 0 0 M 5 -5 L 0 0 M -7 0 L 0 0 M 7 0 L 0 0 M -5 5 L 0 0 M 5 5 L 0 0"
                                  stroke="#AED581" stroke-width="1" fill="none"/>
                            <!-- Lime peel -->
                            <path d="M -8 -6 Q -10 -3 -10 0 Q -10 3 -8 6"
                                  fill="#558B2F" stroke="#33691E" stroke-width="1"/>
                        </g>

                        <!-- Bubbles -->
                        <circle cx="40" cy="50" r="2" fill="#FFFFFF" opacity="0.5"/>
                        <circle cx="55" cy="48" r="1.5" fill="#FFFFFF" opacity="0.6"/>
                        <circle cx="48" cy="55" r="1.8" fill="#FFFFFF" opacity="0.5"/>

                        <!-- Gradients -->
                        <defs>
                            <linearGradient id="margaritaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.3"/>
                                <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.5"/>
                            </linearGradient>
                            <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#C5E1A5;stop-opacity:0.9"/>
                                <stop offset="50%" style="stop-color:#9CCC65;stop-opacity:0.9"/>
                                <stop offset="100%" style="stop-color:#7CB342;stop-opacity:0.95"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
        </div>

        <div class="results">
            <div class="result-row tip-row">
                <span class="result-label">Tip</span>
                <span class="result-value" id="tipAmount">$0.00</span>
            </div>
            <div class="result-row total-row">
                <span class="result-label">Total</span>
                <span class="result-value" id="totalAmount">$0.00</span>
            </div>
        </div>

        <div class="expensive-warning" id="expensiveWarning">¡Puta Que Caro!</div>
    </div>

    <script>
        const billAmountInput = document.getElementById('billAmount');
        const tipSlider = document.getElementById('tipSlider');
        const tipPercentageDisplay = document.getElementById('tipPercentageDisplay');
        const tipAmountDisplay = document.getElementById('tipAmount');
        const totalAmountDisplay = document.getElementById('totalAmount');
        const expensiveWarning = document.getElementById('expensiveWarning');
        const presetButtons = document.querySelectorAll('.preset-btn');
        const margaritaIcon = document.getElementById('margaritaIcon');

        function updateMargaritaPosition() {
            const slider = tipSlider;
            const percent = (slider.value - slider.min) / (slider.max - slider.min);
            const sliderWidth = slider.offsetWidth;
            const iconPosition = percent * (sliderWidth - 50);
            margaritaIcon.style.left = iconPosition + 'px';
        }

        function calculateTip() {
            const billAmount = parseFloat(billAmountInput.value) || 0;
            const tipPercentage = parseInt(tipSlider.value);

            const tipAmount = billAmount * (tipPercentage / 100);
            const totalAmount = billAmount + tipAmount;

            tipPercentageDisplay.textContent = tipPercentage + '%';
            tipAmountDisplay.textContent = '$' + tipAmount.toFixed(2);
            totalAmountDisplay.textContent = '$' + totalAmount.toFixed(2);

            if (totalAmount > 100) {
                expensiveWarning.classList.add('show');
            } else {
                expensiveWarning.classList.remove('show');
            }

            updateMargaritaPosition();
            updateActivePreset();
        }

        function updateActivePreset() {
            const currentTip = parseInt(tipSlider.value);
            presetButtons.forEach(btn => {
                if (parseInt(btn.dataset.tip) === currentTip) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipSlider.value = btn.dataset.tip;
                calculateTip();
            });
        });

        billAmountInput.addEventListener('input', calculateTip);
        tipSlider.addEventListener('input', calculateTip);

        // Auto-clear zero when user focuses on the input
        billAmountInput.addEventListener('focus', function() {
            if (parseFloat(this.value) === 0 || this.value === '0' || this.value === '') {
                this.value = '';
            }
        });

        // Restore zero if user leaves field empty
        billAmountInput.addEventListener('blur', function() {
            if (this.value === '' || this.value === null) {
                this.value = '0';
                calculateTip();
            }
        });

        window.addEventListener('resize', updateMargaritaPosition);

        calculateTip();
    </script>
</body>
</html>
