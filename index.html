<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Pongo El Tip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.5em;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .slider-container {
            margin-bottom: 30px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tip-percentage {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }

        .results {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .result-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 1.1em;
            color: #555;
        }

        .result-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .total-row .result-label {
            font-size: 1.3em;
            color: #667eea;
        }

        .total-row .result-value {
            font-size: 2em;
            color: #667eea;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 25px;
            }

            .result-value {
                font-size: 1.3em;
            }

            .total-row .result-value {
                font-size: 1.7em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yo Pongo El Tip</h1>

        <div class="input-group">
            <label for="billAmount">Monto de la Cuenta</label>
            <input type="number" id="billAmount" placeholder="$0.00" min="0" step="0.01" value="0">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <label>Porcentaje de Propina</label>
                <span class="tip-percentage" id="tipPercentageDisplay">15%</span>
            </div>
            <input type="range" id="tipSlider" min="0" max="30" value="15" step="1">
        </div>

        <div class="results">
            <div class="result-row">
                <span class="result-label">Propina:</span>
                <span class="result-value" id="tipAmount">$0.00</span>
            </div>
            <div class="result-row total-row">
                <span class="result-label">Total:</span>
                <span class="result-value" id="totalAmount">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        const billAmountInput = document.getElementById('billAmount');
        const tipSlider = document.getElementById('tipSlider');
        const tipPercentageDisplay = document.getElementById('tipPercentageDisplay');
        const tipAmountDisplay = document.getElementById('tipAmount');
        const totalAmountDisplay = document.getElementById('totalAmount');

        function calculateTip() {
            const billAmount = parseFloat(billAmountInput.value) || 0;
            const tipPercentage = parseInt(tipSlider.value);

            const tipAmount = billAmount * (tipPercentage / 100);
            const totalAmount = billAmount + tipAmount;

            tipPercentageDisplay.textContent = tipPercentage + '%';
            tipAmountDisplay.textContent = '$' + tipAmount.toFixed(2);
            totalAmountDisplay.textContent = '$' + totalAmount.toFixed(2);
        }

        billAmountInput.addEventListener('input', calculateTip);
        tipSlider.addEventListener('input', calculateTip);

        calculateTip();
    </script>
</body>
</html>
