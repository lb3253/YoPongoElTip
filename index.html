<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA Manifest (Android + modern browsers) -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="El Tip">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Theme color for browser chrome (Android) -->
    <meta name="theme-color" content="#1E5BA8">

    <title>Yo Pongo El Tip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .lang-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            min-width: 44px;
            height: 36px;
            padding: 0 8px;
            font-size: 0.85em;
            font-weight: 700;
            font-family: inherit;
            color: #1E5BA8;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .lang-toggle:active {
            background: #f3f4f6;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            width: 450px;
        }

        h1 {
            display: none;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 1em;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 0.95em;
        }

        #billAmount {
            width: 100%;
            padding: 16px;
            font-size: 1.8em;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            transition: all 0.2s;
            font-family: inherit;
        }

        #billAmount:focus {
            outline: none;
            border-color: #1E5BA8;
            box-shadow: 0 0 0 4px rgba(30, 91, 168, 0.1);
        }

        .presets {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .preset-btn {
            flex: 1;
            padding: 16px 10px;
            min-height: 52px;
            font-size: 1.15em;
            font-weight: 600;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-btn:hover {
            border-color: #1E5BA8;
            background: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 91, 168, 0.15);
        }

        .preset-btn:active {
            transform: translateY(0);
        }

        .preset-btn.active {
            background: linear-gradient(135deg, #0A8754 0%, #0A8754 100%);
            color: #ffffff;
            border-color: #0A8754;
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.3);
        }

        .slider-container {
            margin-bottom: 32px;
            padding: 24px;
            background: #f9fafb;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tip-percentage {
            font-size: 2.2em;
            font-weight: 700;
            color: #0A8754;
            letter-spacing: -1px;
        }

        .slider-wrapper {
            position: relative;
            padding: 35px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, #F5B800 0%, #0A8754 50%, #1E5BA8 100%);
            outline: none;
            -webkit-appearance: none;
            position: relative;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 110px;
            cursor: pointer;
            background: transparent;
            border: none;
            opacity: 0;
        }

        input[type="range"]::-moz-range-thumb {
            width: 110px;
            height: 110px;
            cursor: pointer;
            border: none;
            background: transparent;
            opacity: 0;
        }

        .margarita-icon {
            position: absolute;
            width: 110px;
            height: 110px;
            pointer-events: none;
            transform: translateX(-50%) translateY(-58px);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            left: 0;
            top: 50%;
        }

        .margarita-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .results {
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            border-radius: 16px;
            padding: 28px;
            margin-top: 28px;
            box-shadow: 0 10px 40px rgba(30, 91, 168, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .result-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #ffffff;
        }

        .tip-row {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 28px !important;
            margin: -8px -8px 24px -8px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
        }

        .tip-row .result-label {
            font-size: 1.4em;
            color: #ffffff;
        }

        .tip-row .result-value {
            font-size: 3.2em;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        /* One quick pulse each time the tip changes */
        .tip-row .result-value.pulse {
            animation: pulse 0.35s ease-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tip-row .result-value.pulse {
                animation: none;
            }
        }

        .total-row .result-label {
            font-size: 1.2em;
        }

        .total-row .result-value {
            font-size: 2em;
        }

        .version {
            text-align: center;
            margin-top: 12px;
            font-size: 0.75em;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 14px 14px 16px;
                border-radius: 20px;
            }

            .logo-container {
                margin-bottom: 6px;
            }

            .logo-container img {
                width: 240px;
            }

            .subtitle {
                display: none;
            }

            .input-group {
                margin-bottom: 10px;
            }

            label {
                margin-bottom: 4px;
            }

            #billAmount {
                font-size: 1.5em;
                padding: 8px 14px;
            }

            .presets {
                gap: 10px;
                margin-bottom: 10px;
            }

            .preset-btn {
                font-size: 1.05em;
                padding: 8px;
                min-height: 44px;
            }

            .slider-container {
                padding: 10px 14px 0;
                margin-bottom: 10px;
            }

            .slider-label {
                margin-bottom: 0;
            }

            .tip-percentage {
                font-size: 1.6em;
            }

            .slider-wrapper {
                padding: 58px 0 50px;
            }

            .results {
                padding: 12px 14px;
                margin-top: 10px;
            }

            .result-row {
                margin-bottom: 8px;
                padding-bottom: 8px;
            }

            .tip-row {
                padding: 10px 16px !important;
                margin: 0 0 8px 0;
            }

            .tip-row .result-label {
                font-size: 1.2em;
            }

            .tip-row .result-value {
                font-size: 2.4em;
            }

            .result-value {
                font-size: 1.4em;
            }

            .total-row .result-value {
                font-size: 1.6em;
            }

            .version {
                margin-top: 8px;
            }
        }

        @media (max-width: 375px) {
            .lang-toggle {
                top: 8px;
                right: 8px;
                min-width: 40px;
                height: 32px;
                padding: 0 6px;
            }

            .logo-container img {
                width: 200px;
            }

            .tip-row {
                padding: 10px 12px !important;
            }

            .tip-row .result-value {
                font-size: 2.1em;
            }

            .preset-btn {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button type="button" class="lang-toggle" id="langToggle"></button>
        <div class="logo-container">
            <img src="YoPongoElTip.webp" alt="Yo Pongo El Tip" width="843" height="352">
        </div>
        <h1>Yo Pongo El Tip</h1>
        <div class="subtitle" data-i18n="subtitle">Tip Calculator</div>

        <div class="input-group">
            <label for="billAmount" data-i18n="bill">Bill Amount</label>
            <input type="text" id="billAmount" placeholder="$0.00" value="0" inputmode="decimal" autocomplete="off">
        </div>

        <div class="presets">
            <button class="preset-btn" data-tip="15">15%</button>
            <button class="preset-btn" data-tip="20">20%</button>
            <button class="preset-btn" data-tip="25">25%</button>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <label id="tipSliderLabel" data-i18n="tipPercent">Tip Percentage</label>
                <span class="tip-percentage" id="tipPercentageDisplay">15%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="tipSlider" min="0" max="30" value="15" step="1" aria-labelledby="tipSliderLabel">
                <div class="margarita-icon" id="margaritaIcon">
                    <img src="MargSlider.webp" alt="">
                </div>
            </div>
        </div>

        <div class="results">
            <div class="result-row tip-row">
                <span class="result-label" data-i18n="tip">Tip</span>
                <span class="result-value" id="tipAmount">$0.00</span>
            </div>
            <div class="result-row total-row">
                <span class="result-label" data-i18n="total">Total</span>
                <span class="result-value" id="totalAmount">$0.00</span>
            </div>
        </div>

        <div class="version">v1.3.0</div>
    </div>

    <script>
        const billAmountInput = document.getElementById('billAmount');
        const tipSlider = document.getElementById('tipSlider');
        const tipPercentageDisplay = document.getElementById('tipPercentageDisplay');
        const tipAmountDisplay = document.getElementById('tipAmount');
        const totalAmountDisplay = document.getElementById('totalAmount');
        const presetButtons = document.querySelectorAll('.preset-btn');
        const margaritaIcon = document.getElementById('margaritaIcon');

        // Center the glass over the invisible native thumb, which is as wide as the icon
        function updateMargaritaPosition() {
            const slider = tipSlider;
            const percent = (slider.value - slider.min) / (slider.max - slider.min);
            const thumbWidth = margaritaIcon.offsetWidth;
            const thumbCenter = thumbWidth / 2 + percent * (slider.offsetWidth - thumbWidth);
            margaritaIcon.style.left = thumbCenter + 'px';
        }

        // Accepts "12.50" or "12,50". The last separator is the decimal point
        // ("0.005", "12.345" stay decimals). Earlier separators are thousands
        // ("1,234.56" / "1.234,56"), and so is one that repeats ("1.234.567").
        function parseAmount(text) {
            const cleaned = text.replace(/[^\d.,]/g, '');
            const lastSep = Math.max(cleaned.lastIndexOf('.'), cleaned.lastIndexOf(','));
            if (lastSep === -1) return Number(cleaned) || 0;

            const sep = cleaned[lastSep];
            if (cleaned.indexOf(sep) !== lastSep) return Number(cleaned.replace(/[.,]/g, '')) || 0;

            const whole = cleaned.slice(0, lastSep).replace(/[.,]/g, '');
            const fraction = cleaned.slice(lastSep + 1);
            return Number((whole || '0') + '.' + fraction) || 0;
        }

        function calculateTip() {
            const billAmount = parseAmount(billAmountInput.value);
            const tipPercentage = parseInt(tipSlider.value);

            const tipAmount = billAmount * (tipPercentage / 100);
            const totalAmount = billAmount + tipAmount;

            tipPercentageDisplay.textContent = tipPercentage + '%';
            const tipText = '$' + tipAmount.toFixed(2);
            if (tipAmountDisplay.textContent !== tipText) {
                tipAmountDisplay.textContent = tipText;
                // Restart the pulse animation
                tipAmountDisplay.classList.remove('pulse');
                void tipAmountDisplay.offsetWidth;
                tipAmountDisplay.classList.add('pulse');
            }
            totalAmountDisplay.textContent = '$' + totalAmount.toFixed(2);

            updateMargaritaPosition();
            updateActivePreset();
        }

        function updateActivePreset() {
            const currentTip = parseInt(tipSlider.value);
            presetButtons.forEach(btn => {
                if (parseInt(btn.dataset.tip) === currentTip) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipSlider.value = btn.dataset.tip;
                calculateTip();
            });
        });

        // Only digits and decimal separators can be typed or pasted (no minus signs or letters)
        billAmountInput.addEventListener('input', function() {
            const cleaned = this.value.replace(/[^\d.,]/g, '');
            if (cleaned !== this.value) this.value = cleaned;
            calculateTip();
        });
        tipSlider.addEventListener('input', calculateTip);

        // Auto-clear zero when user focuses on the input
        billAmountInput.addEventListener('focus', function() {
            if (parseAmount(this.value) === 0) {
                this.value = '';
            }
        });

        // Restore zero if user leaves field empty
        billAmountInput.addEventListener('blur', function() {
            if (this.value === '' || this.value === null) {
                this.value = '0';
                calculateTip();
            }
        });

        window.addEventListener('resize', updateMargaritaPosition);

        // English / Spanish text. The button shows the language you can switch to.
        const translations = {
            en: {
                subtitle: 'Tip Calculator',
                bill: 'Bill Amount',
                tipPercent: 'Tip Percentage',
                tip: 'Tip',
                total: 'Total',
                toggle: 'ES',
                toggleLabel: 'Cambiar a español'
            },
            es: {
                subtitle: 'Calculadora de propinas',
                bill: 'Monto de la cuenta',
                tipPercent: 'Porcentaje de propina',
                tip: 'Propina',
                total: 'Total',
                toggle: 'EN',
                toggleLabel: 'Switch to English'
            }
        };
        const langToggle = document.getElementById('langToggle');
        let currentLang;

        function setLanguage(lang) {
            currentLang = lang;
            const text = translations[lang];
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = text[el.dataset.i18n];
            });
            langToggle.textContent = text.toggle;
            langToggle.setAttribute('aria-label', text.toggleLabel);
            langToggle.lang = lang === 'en' ? 'es' : 'en';
        }

        langToggle.addEventListener('click', () => {
            const lang = currentLang === 'en' ? 'es' : 'en';
            setLanguage(lang);
            try { localStorage.setItem('lang', lang); } catch (e) {}
        });

        // Use the saved choice, otherwise the phone's language
        let savedLang = null;
        try { savedLang = localStorage.getItem('lang'); } catch (e) {}
        const phoneLang = (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en';
        setLanguage(translations[savedLang] ? savedLang : phoneLang);

        calculateTip();
    </script>
</body>
</html>
