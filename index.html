<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA Manifest (Android + modern browsers) -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="El Tip">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Theme color for browser chrome (Android) -->
    <meta name="theme-color" content="#1E5BA8">

    <title>Yo Pongo El Tip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            width: 450px;
        }

        h1 {
            display: none;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 1em;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label, .label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 0.95em;
        }

        #billAmount {
            width: 100%;
            padding: 16px;
            font-size: 1.8em;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            transition: all 0.2s;
            font-family: inherit;
        }

        #billAmount:focus {
            outline: none;
            border-color: #1E5BA8;
            box-shadow: 0 0 0 4px rgba(30, 91, 168, 0.1);
        }

        .presets {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .preset-btn {
            flex: 1;
            padding: 16px 10px;
            min-height: 52px;
            font-size: 1.15em;
            font-weight: 600;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-btn:hover {
            border-color: #1E5BA8;
            background: #f9fafb;
        }

        .preset-btn.active {
            background: #0A8754;
            color: #ffffff;
            border-color: #0A8754;
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.3);
        }

        .slider-container {
            margin-bottom: 20px;
            padding: 24px;
            background: #f9fafb;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .slider-label .label {
            margin-bottom: 0;
        }

        .tip-percentage {
            font-size: 2.2em;
            font-weight: 700;
            color: #0A8754;
            letter-spacing: -1px;
        }

        .slider-wrapper {
            position: relative;
            padding: 35px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, #F5B800 0%, #0A8754 50%, #1E5BA8 100%);
            outline: none;
            -webkit-appearance: none;
            position: relative;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 110px;
            cursor: pointer;
            background: transparent;
            border: none;
            opacity: 0;
        }

        input[type="range"]::-moz-range-thumb {
            width: 110px;
            height: 110px;
            cursor: pointer;
            border: none;
            background: transparent;
            opacity: 0;
        }

        .margarita-icon {
            position: absolute;
            width: 110px;
            height: 110px;
            pointer-events: none;
            transform: translateX(-50%) translateY(-58px);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            left: 0;
            top: 50%;
        }

        .margarita-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* People counter + round-up toggle */
        .options {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .people {
            flex: 1.4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 6px 6px 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .people .label {
            margin: 0;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #1E5BA8;
            font-size: 1.4em;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .step-btn:disabled {
            color: #d1d5db;
            cursor: default;
        }

        #peopleCount {
            min-width: 28px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            color: #1f2937;
        }

        .round-btn {
            flex: 1;
            min-height: 52px;
            padding: 6px 10px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .round-btn.active {
            background: #0A8754;
            color: #ffffff;
            border-color: #0A8754;
        }

        .results {
            background: linear-gradient(135deg, #1E5BA8 0%, #003D7A 100%);
            border-radius: 16px;
            padding: 28px;
            margin-top: 20px;
            box-shadow: 0 10px 40px rgba(30, 91, 168, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-row[hidden] {
            display: none;
        }

        .result-label {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .result-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .highlight-row {
            background: rgba(255, 255, 255, 0.15);
            padding: 28px !important;
            margin: -8px -8px 24px -8px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
        }

        .highlight-row .result-label {
            font-size: 1.4em;
            color: #ffffff;
        }

        .highlight-row .result-value {
            font-size: 3.2em;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        /* A quick "pop" when the number changes, instead of pulsing forever */
        .pop {
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .pop { animation: none; }
        }

        .total-row .result-label {
            font-size: 1.2em;
        }

        .total-row .result-value {
            font-size: 2em;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .lang-toggle {
            display: flex;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        .lang-btn {
            padding: 6px 12px;
            font-size: 0.8em;
            font-weight: 600;
            border: none;
            background: #ffffff;
            color: #6b7280;
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .lang-btn.active {
            background: #1E5BA8;
            color: #ffffff;
        }

        .version {
            font-size: 0.75em;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 14px 14px 12px;
                border-radius: 20px;
            }

            .logo-container {
                margin-bottom: 6px;
            }

            .logo-container img {
                width: 220px;
            }

            .subtitle {
                display: none;
            }

            .input-group {
                margin-bottom: 10px;
            }

            label, .label {
                margin-bottom: 4px;
            }

            #billAmount {
                font-size: 1.5em;
                padding: 8px 14px;
            }

            .presets {
                gap: 10px;
                margin-bottom: 10px;
            }

            .preset-btn {
                font-size: 1.05em;
                padding: 8px;
                min-height: 44px;
            }

            .slider-container {
                padding: 10px 14px 0;
                margin-bottom: 10px;
            }

            .tip-percentage {
                font-size: 1.6em;
            }

            .slider-label {
                margin-bottom: 0;
            }

            .slider-wrapper {
                padding: 58px 0 50px;
            }

            .options {
                gap: 10px;
            }

            .round-btn {
                min-height: 52px;
                font-size: 0.95em;
            }

            .results {
                padding: 12px 14px;
                margin-top: 10px;
            }

            .result-row {
                margin-bottom: 8px;
                padding-bottom: 8px;
            }

            .highlight-row {
                padding: 10px 16px !important;
                margin: 0 0 8px 0;
            }

            .highlight-row .result-label {
                font-size: 1.2em;
            }

            .highlight-row .result-value {
                font-size: 2.4em;
            }

            .result-value {
                font-size: 1.4em;
            }

            .total-row .result-value {
                font-size: 1.6em;
            }

            .footer {
                margin-top: 8px;
            }
        }

        @media (max-width: 375px) {
            .logo-container img {
                width: 190px;
            }

            .highlight-row .result-value {
                font-size: 2.1em;
            }

            .preset-btn {
                font-size: 0.95em;
            }

            .step-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo.webp" alt="Yo Pongo El Tip" width="843" height="352">
        </div>
        <h1>Yo Pongo El Tip</h1>
        <div class="subtitle" data-i18n="subtitle">Tip Calculator</div>

        <div class="input-group">
            <label for="billAmount" data-i18n="bill">Bill Amount</label>
            <input type="text" id="billAmount" placeholder="$0.00" value="0" inputmode="decimal" autocomplete="off">
        </div>

        <div class="presets">
            <button class="preset-btn" data-tip="15">15%</button>
            <button class="preset-btn" data-tip="20">20%</button>
            <button class="preset-btn" data-tip="25">25%</button>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span class="label" data-i18n="tipPct">Tip Percentage</span>
                <span class="tip-percentage" id="tipPercentageDisplay">15%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="tipSlider" min="0" max="30" value="15" step="1" aria-label="Tip percentage">
                <div class="margarita-icon" id="margaritaIcon">
                    <img src="marg.webp" alt="">
                </div>
            </div>
        </div>

        <div class="options">
            <div class="people">
                <span class="label" data-i18n="people">People</span>
                <div class="stepper">
                    <button class="step-btn" id="peopleMinus" aria-label="Fewer people">−</button>
                    <span id="peopleCount" aria-live="polite">1</span>
                    <button class="step-btn" id="peoplePlus" aria-label="More people">+</button>
                </div>
            </div>
            <button class="round-btn" id="roundBtn" aria-pressed="false" data-i18n="roundUp">Round up</button>
        </div>

        <div class="results">
            <div class="result-row highlight-row" id="eachRow" hidden>
                <span class="result-label" data-i18n="each">Each person</span>
                <span class="result-value" id="eachAmount">$0.00</span>
            </div>
            <div class="result-row" id="tipRow">
                <span class="result-label" data-i18n="tip">Tip</span>
                <span class="result-value" id="tipAmount">$0.00</span>
            </div>
            <div class="result-row total-row">
                <span class="result-label" data-i18n="total">Total</span>
                <span class="result-value" id="totalAmount">$0.00</span>
            </div>
        </div>

        <div class="footer">
            <div class="lang-toggle" role="group" aria-label="Language / Idioma">
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
            <div class="version">v1.3.0</div>
        </div>
    </div>

    <script>
        const MAX_PEOPLE = 20;
        const MAX_BILL = 1000000;

        const TEXT = {
            en: {
                subtitle: 'Tip Calculator',
                bill: 'Bill Amount',
                tipPct: 'Tip Percentage',
                people: 'People',
                roundUp: 'Round up',
                each: 'Each person',
                tip: 'Tip',
                total: 'Total',
                sliderAria: 'Tip percentage',
                minusAria: 'Fewer people',
                plusAria: 'More people'
            },
            es: {
                subtitle: 'Calculadora de propina',
                bill: 'Cuenta',
                tipPct: 'Porcentaje',
                people: 'Personas',
                roundUp: 'Redondear',
                each: 'Por persona',
                tip: 'Propina',
                total: 'Total',
                sliderAria: 'Porcentaje de propina',
                minusAria: 'Menos personas',
                plusAria: 'Más personas'
            }
        };

        const $ = id => document.getElementById(id);
        const billAmountInput = $('billAmount');
        const tipSlider = $('tipSlider');
        const tipPercentageDisplay = $('tipPercentageDisplay');
        const tipAmountDisplay = $('tipAmount');
        const totalAmountDisplay = $('totalAmount');
        const eachAmountDisplay = $('eachAmount');
        const eachRow = $('eachRow');
        const tipRow = $('tipRow');
        const peopleCountDisplay = $('peopleCount');
        const peopleMinus = $('peopleMinus');
        const peoplePlus = $('peoplePlus');
        const roundBtn = $('roundBtn');
        const presetButtons = document.querySelectorAll('.preset-btn');
        const langButtons = document.querySelectorAll('.lang-btn');
        const margaritaIcon = $('margaritaIcon');

        let people = 1;
        let roundUp = false;
        let lang = 'en';

        // Saved settings (tip %, language). Wrapped in try/catch because
        // private browsing can block storage; the app still works without it.
        function load(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function save(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
        }

        // Center the glass over the invisible native thumb, which is as wide as the icon
        function updateMargaritaPosition() {
            const slider = tipSlider;
            const percent = (slider.value - slider.min) / (slider.max - slider.min);
            const thumbWidth = margaritaIcon.offsetWidth;
            const thumbCenter = thumbWidth / 2 + percent * (slider.offsetWidth - thumbWidth);
            margaritaIcon.style.left = thumbCenter + 'px';
        }

        // Turns what was typed into a number of dollars.
        //   "45.50" / "45,50" -> 45.50     "1,234" / "1,234.56" -> thousands
        //   A dot is always the decimal point; only 2 decimals are kept,
        //   so "0.005" is $0.00 (not $5) and "12.345" is $12.34 (not $12,345).
        function parseAmount(text) {
            let s = text.replace(/[^\d.,]/g, '');
            s = s.replace(/,(?=\d{3}(?:\D|$))/g, ''); // comma + 3 digits = thousands
            s = s.replace(/,/g, '.');                  // any other comma = decimal
            const dot = s.indexOf('.');
            if (dot !== -1) {
                s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '').slice(0, 2);
            }
            const n = Number(s);
            return Number.isFinite(n) ? Math.min(n, MAX_BILL) : 0;
        }

        function money(cents) {
            return '$' + (cents / 100).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function setValue(el, text) {
            if (el.textContent === text) return;
            el.textContent = text;
            el.classList.remove('pop');
            void el.offsetWidth; // restart the animation
            el.classList.add('pop');
        }

        function calculateTip() {
            // Work in cents so there are no rounding surprises like $10.000000001
            const billCents = Math.round(parseAmount(billAmountInput.value) * 100);
            const tipPercentage = parseInt(tipSlider.value, 10);

            let totalCents = billCents + Math.round(billCents * tipPercentage / 100);
            let eachCents;

            if (roundUp) {
                // Round each person's share up to a whole dollar
                eachCents = Math.ceil(totalCents / people / 100) * 100;
                totalCents = eachCents * people;
            } else {
                // Round each share up to the cent so the group never comes up short
                eachCents = Math.ceil(totalCents / people);
                if (people > 1) totalCents = eachCents * people;
            }

            const tipCents = totalCents - billCents;

            tipPercentageDisplay.textContent = tipPercentage + '%';
            setValue(tipAmountDisplay, money(tipCents));
            setValue(totalAmountDisplay, money(totalCents));
            setValue(eachAmountDisplay, money(eachCents));

            // When splitting, "Each person" becomes the big number; otherwise the tip is
            const splitting = people > 1;
            eachRow.hidden = !splitting;
            tipRow.classList.toggle('highlight-row', !splitting);

            updateMargaritaPosition();
            updateActivePreset();
        }

        function updateActivePreset() {
            const currentTip = parseInt(tipSlider.value, 10);
            presetButtons.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.tip, 10) === currentTip);
            });
        }

        function setPeople(n) {
            people = Math.max(1, Math.min(MAX_PEOPLE, n));
            peopleCountDisplay.textContent = people;
            peopleMinus.disabled = people === 1;
            peoplePlus.disabled = people === MAX_PEOPLE;
            calculateTip();
        }

        function setLanguage(newLang) {
            lang = TEXT[newLang] ? newLang : 'en';
            const t = TEXT[lang];
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t[el.dataset.i18n];
            });
            tipSlider.setAttribute('aria-label', t.sliderAria);
            peopleMinus.setAttribute('aria-label', t.minusAria);
            peoplePlus.setAttribute('aria-label', t.plusAria);
            langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
            save('lang', lang);
        }

        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipSlider.value = btn.dataset.tip;
                save('tip', tipSlider.value);
                calculateTip();
            });
        });

        // Only digits and decimal separators can be typed or pasted (no minus signs or letters),
        // and no more than 2 digits after a dot
        billAmountInput.addEventListener('input', function() {
            const cleaned = this.value.replace(/[^\d.,]/g, '').replace(/(\.\d{2})\d+$/, '$1');
            if (cleaned !== this.value) this.value = cleaned;
            calculateTip();
        });

        tipSlider.addEventListener('input', () => {
            save('tip', tipSlider.value);
            calculateTip();
        });

        peopleMinus.addEventListener('click', () => setPeople(people - 1));
        peoplePlus.addEventListener('click', () => setPeople(people + 1));

        roundBtn.addEventListener('click', () => {
            roundUp = !roundUp;
            roundBtn.classList.toggle('active', roundUp);
            roundBtn.setAttribute('aria-pressed', roundUp);
            calculateTip();
        });

        langButtons.forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        // Auto-clear zero when user focuses on the input
        billAmountInput.addEventListener('focus', function() {
            if (parseAmount(this.value) === 0) {
                this.value = '';
            }
        });

        // Restore zero if user leaves field empty
        billAmountInput.addEventListener('blur', function() {
            if (this.value === '') {
                this.value = '0';
                calculateTip();
            }
        });

        window.addEventListener('resize', updateMargaritaPosition);

        // Start up: saved language, or the phone's language the first time
        const savedLang = load('lang');
        const phoneLang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
        setLanguage(savedLang || phoneLang);

        const savedTip = parseInt(load('tip'), 10);
        if (savedTip >= 0 && savedTip <= 30) tipSlider.value = savedTip;

        setPeople(1);

        // Offline support: saves the app on the phone so it opens without internet
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
